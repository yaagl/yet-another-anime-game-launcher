name: "Build Latest (when new tag created)"
on:
  push:
    tags:
      - '*'
env:
  YAAGL_VERSION: ${{ github.ref_name }}
permissions:
  contents: "write"
  packages: "write"
  pull-requests: "read"
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: vendor/SophonClientv3/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-6.3.3-${{ hashFiles('build-sophon.sh', 'vendor/SophonClientv3/Package.swift', 'vendor/SophonClientv3/Package.resolved') }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 7
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: |
          ./configure.sh
          YAAGL_CHANNEL_CLIENT=hk4ecn node ./build-app.js
          cp dist/Yaagl/resources.neu resources_hk4ecn.neu
          YAAGL_CHANNEL_CLIENT=hk4eos node ./build-app.js
          cp dist/Yaagl/resources.neu resources_hk4eos.neu 
          YAAGL_CHANNEL_CLIENT=bh3glb node ./build-app.js
          cp dist/Yaagl/resources.neu resources_bh3glb.neu
          YAAGL_CHANNEL_CLIENT=hkrpgcn node ./build-app.js
          cp dist/Yaagl/resources.neu resources_hkrpgcn.neu
          YAAGL_CHANNEL_CLIENT=hkrpgos node ./build-app.js
          cp dist/Yaagl/resources.neu resources_hkrpgos.neu
          YAAGL_CHANNEL_CLIENT=napcn node ./build-app.js
          cp dist/Yaagl/resources.neu resources_napcn.neu
          YAAGL_CHANNEL_CLIENT=napos node ./build-app.js
          cp dist/Yaagl/resources.neu resources_napos.neu

      - name: Setup Node 20 for DMG creation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tar app and Create DMG
        run: |
          npm install -g create-dmg
          
          # Standard tarballs for auto-updater
          tar -zcf Yaagl.app.tar.gz Yaagl.app
          tar -zcf "Yaagl OS.app.tar.gz" "Yaagl OS.app"
          tar -zcf "Yaagl Honkai Global.app.tar.gz" "Yaagl Honkai Global.app"
          tar -zcf "Yaagl HSR.app.tar.gz" "Yaagl HSR.app"
          tar -zcf "Yaagl HSR OS.app.tar.gz" "Yaagl HSR OS.app"
          tar -zcf "Yaagl ZZZ.app.tar.gz" "Yaagl ZZZ.app"
          tar -zcf "Yaagl ZZZ OS.app.tar.gz" "Yaagl ZZZ OS.app"
          
          # DMGs for manual downloads
          create-dmg --no-code-sign --dmg-title="Yaagl" "Yaagl.app" || true
          mv "Yet Another Anime Game Launcher "*.dmg "Yaagl.dmg"
          
          create-dmg --no-code-sign --dmg-title="Yaagl OS" "Yaagl OS.app" || true
          mv "Yet Another Anime Game Launcher "*.dmg "Yaagl OS.dmg"
          
          create-dmg --no-code-sign --dmg-title="Yaagl Honkai Global" "Yaagl Honkai Global.app" || true
          mv "Yet Another Anime Game Launcher "*.dmg "Yaagl Honkai Global.dmg"
          
          create-dmg --no-code-sign --dmg-title="Yaagl HSR" "Yaagl HSR.app" || true
          mv "Yet Another Anime Game Launcher "*.dmg "Yaagl HSR.dmg"
          
          create-dmg --no-code-sign --dmg-title="Yaagl HSR OS" "Yaagl HSR OS.app" || true
          mv "Yet Another Anime Game Launcher "*.dmg "Yaagl HSR OS.dmg"
          
          create-dmg --no-code-sign --dmg-title="Yaagl ZZZ" "Yaagl ZZZ.app" || true
          mv "Yet Another Anime Game Launcher "*.dmg "Yaagl ZZZ.dmg"
          
          create-dmg --no-code-sign --dmg-title="Yaagl ZZZ OS" "Yaagl ZZZ OS.app" || true
          mv "Yet Another Anime Game Launcher "*.dmg "Yaagl ZZZ OS.dmg"

      - name: Generate prerelease
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          title: "Release ${{ github.ref_name }}"
          files: |
            *.dmg
            *.app.tar.gz
            resources_hk4ecn.neu
            resources_hk4eos.neu
            resources_bh3glb.neu
            resources_hkrpgcn.neu
            resources_hkrpgos.neu
            resources_napcn.neu
            resources_napos.neu
